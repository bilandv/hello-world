<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>ШИФР → Threads</title>
  <style>
    :root { color-scheme: dark light; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#111; color:#fff; }
    main { width:min(92vw,520px); text-align:center; padding:28px; }
    .spinner { width:42px; height:42px; margin:0 auto 18px; border:4px solid #555; border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    p { opacity:.82; line-height:1.45; }
    a { display:inline-block; margin-top:14px; padding:13px 18px; border-radius:12px; background:#fff; color:#111; text-decoration:none; font-weight:700; }
    .small { font-size:13px; opacity:.55; }
  </style>
</head>
<body>
<main>
  <div class="spinner" aria-hidden="true"></div>
  <h2>Відкриваємо Threads…</h2>
  <p>Готовий пост уже підготовлено.</p>
  <a id="fallback" href="#">Відкрити Threads</a>
  <p class="small">Якщо Threads не встановлено, відкриється вебверсія.</p>
</main>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  function decodeBase64Url(value) {
    if (!value) return '';
    try {
      const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
      const bytes = Uint8Array.from(atob(padded), c => c.charCodeAt(0));
      return new TextDecoder('utf-8').decode(bytes);
    } catch (_) { return ''; }
  }
  const text = decodeBase64Url(q.get('t')) || q.get('text') || '';
  const web = 'https://www.threads.com/intent/post?text=' + encodeURIComponent(text);
  const fallback = document.getElementById('fallback');
  fallback.href = web;

  if (!text) {
    document.querySelector('h2').textContent = 'Немає тексту для поширення';
    document.querySelector('.spinner').style.display = 'none';
    return;
  }

  const ua = navigator.userAgent || '';
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  let backgrounded = false;
  document.addEventListener('visibilitychange', () => { if (document.hidden) backgrounded = true; });
  window.addEventListener('pagehide', () => { backgrounded = true; });

  const native = 'barcelona://create?text=' + encodeURIComponent(text);
  const androidIntent =
    'intent://create?text=' + encodeURIComponent(text) +
    '#Intent;scheme=barcelona;package=com.instagram.barcelona;' +
    'S.browser_fallback_url=' + encodeURIComponent(web) + ';end';

  function openNative() {
    if (isAndroid) {
      location.href = androidIntent;
    } else if (isIOS) {
      location.href = native;
    } else {
      location.replace(web);
    }
  }

  setTimeout(() => {
    if (!backgrounded && (isAndroid || isIOS)) location.replace(web);
  }, 1800);

  setTimeout(openNative, 60);
})();
</script>
</body>
</html>
