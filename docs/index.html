<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <title>Поділитися результатом ШИФР</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main { width: min(100%, 520px); }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
      text-align: center;
    }
    .lead {
      margin: 0 0 26px;
      text-align: center;
      opacity: .72;
      font-size: 16px;
      line-height: 1.4;
    }
    .share-list { display: grid; gap: 12px; }
    button.share, a.share {
      width: 100%;
      min-height: 60px;
      border: 0;
      border-radius: 16px;
      padding: 0 18px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .primary { background: #fff; color: #111; }
    .soon {
      background: #232323;
      color: #777;
      cursor: default;
    }
    .note {
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      opacity: .56;
    }
    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #2b1c1c;
      color: #ffd7d7;
      font-size: 14px;
      line-height: 1.4;
    }
    #mobile, #desktop { display: none; }
  </style>
</head>
<body>
<main>
  <section id="mobile">
    <h1>📤 Поділитися результатом</h1>
    <p class="lead">Натисніть кнопку нижче та оберіть соцмережу</p>

    <div class="share-list">
      <button id="systemShare" class="share primary" type="button">📤 Поділитися</button>
    </div>

    <p class="note">У системному меню виберіть Threads, Instagram, X, Facebook або інший застосунок.</p>
  </section>

  <section id="desktop">
    <h1>📤 Поділитися результатом</h1>
    <p class="lead">Оберіть соцмережу</p>

    <div class="share-list">
      <button id="threadsDesktop" class="share primary" type="button">Threads</button>
      <button class="share soon" type="button" disabled>Instagram · скоро</button>
      <button class="share soon" type="button" disabled>TikTok · скоро</button>
      <button class="share soon" type="button" disabled>X · скоро</button>
      <button class="share soon" type="button" disabled>Facebook · скоро</button>
    </div>

    <p class="note">Threads відкриється, а точний текст буде скопійовано в буфер обміну.</p>
  </section>

  <div id="error" class="error"></div>
</main>

<script>
(() => {
  const q = new URLSearchParams(location.search);

  function decodeBase64Url(value) {
    if (!value) return '';
    try {
      const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
      const bytes = Uint8Array.from(atob(padded), c => c.charCodeAt(0));
      return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    } catch (_) {
      return '';
    }
  }

  const text = decodeBase64Url(q.get('t')) || q.get('text') || '';
  const ua = navigator.userAgent || '';
  const isMobile = /Android|iPhone|iPad|iPod/i.test(ua);

  const errorBox = document.getElementById('error');
  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  if (!text) {
    document.getElementById(isMobile ? 'mobile' : 'desktop').style.display = 'block';
    showError('Не вдалося отримати текст результату. Поверніться в бот і відкрийте поширення ще раз.');
    return;
  }

  function splitShareTextAndUrl(source) {
    const match = source.match(/https:\/\/t\.me\/[^\s]+/u);
    if (!match) return { body: source, url: '' };
    const url = match[0];
    const body = source
      .replace(url, '')
      .replace(/[ \t]+\n/g, '\n')
      .replace(/\n[ \t]+/g, '\n')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
    return { body, url };
  }

  const desktopShare = splitShareTextAndUrl(text);
  let threadsHref =
    'https://www.threads.com/intent/post?text=' +
    encodeURIComponent(desktopShare.body);
  if (desktopShare.url) {
    threadsHref += '&url=' + encodeURIComponent(desktopShare.url);
  }
  const threadsDesktopButton = document.getElementById('threadsDesktop');

  threadsDesktopButton.addEventListener('click', async () => {
    errorBox.style.display = 'none';

    // Open first, while we still have the user's click, so popup blockers do not interfere.
    const composer = window.open('https://www.threads.com/intent/post', '_blank', 'noopener,noreferrer');

    try {
      await navigator.clipboard.writeText(text);
      const note = document.querySelector('#desktop .note');
      if (note) {
        note.textContent = 'Текст скопійовано. У Threads вставте його через Ctrl+V та натисніть Post.';
      }
    } catch (_) {
      if (composer) composer.close();
      showError('Не вдалося скопіювати текст автоматично. Дозвольте доступ до буфера обміну та спробуйте ще раз.');
    }
  });

  if (!isMobile) {
    document.getElementById('desktop').style.display = 'block';
    return;
  }

  document.getElementById('mobile').style.display = 'block';

  const shareButton = document.getElementById('systemShare');

  shareButton.addEventListener('click', async () => {
    errorBox.style.display = 'none';

    if (typeof navigator.share !== 'function') {
      // Telegram Android WebView does not expose Web Share.
      // On the user's click, hand the exact same HTTPS page to Chrome.
      // There the same button will use navigator.share() normally.
      try {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && typeof tg.openLink === 'function') {
          tg.openLink(window.location.href, {
            try_instant_view: false,
            try_browser: 'chrome'
          });
          return;
        }
      } catch (_) {}

      showError('Системне меню поширення недоступне всередині Telegram. Відкрийте цю сторінку у браузері.');
      return;
    }

    try {
      // Keep ordinary Unicode text. The previous U+2028/U+2029 experiment
      // rendered as visible boxes in Threads. Use conventional Windows/Android
      // CRLF line endings instead and let the receiving app handle plain text.
      const mobileText = text
        .replace(/\r\n?/g, '\n')
        .replace(/\n/g, '\r\n');

      await navigator.share({ text: mobileText });
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      showError('Не вдалося відкрити системне меню поширення.');
    }
  });
})();
</script>
</body>
</html>
