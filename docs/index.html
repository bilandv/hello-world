<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <title>Поділитися результатом ШИФР</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      width: min(100%, 520px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
      text-align: center;
    }
    .lead {
      margin: 0 0 26px;
      text-align: center;
      opacity: .72;
      font-size: 16px;
      line-height: 1.4;
    }
    .share-list {
      display: grid;
      gap: 12px;
    }
    button, a.share {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      padding: 0 18px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    #threads {
      background: #fff;
      color: #111;
    }
    .soon {
      background: #232323;
      color: #777;
      cursor: default;
    }
    .note {
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      opacity: .5;
    }
    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #2b1c1c;
      color: #ffd7d7;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
<main>
  <h1>📤 Поділитися результатом</h1>
  <p class="lead">Оберіть соцмережу</p>

  <div class="share-list">
    <button id="threads" type="button">Threads</button>
    <button class="soon" type="button" disabled>Instagram · скоро</button>
    <button class="soon" type="button" disabled>TikTok · скоро</button>
    <button class="soon" type="button" disabled>X · скоро</button>
    <button class="soon" type="button" disabled>Facebook · скоро</button>
  </div>

  <div id="error" class="error"></div>
  <p class="note">Після натискання Threads відкриється готова чернетка поста.</p>
</main>

<script>
(() => {
  const q = new URLSearchParams(location.search);

  function decodeBase64Url(value) {
    if (!value) return '';
    try {
      const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
      const bytes = Uint8Array.from(atob(padded), c => c.charCodeAt(0));
      return new TextDecoder('utf-8').decode(bytes);
    } catch (_) {
      return '';
    }
  }

  const text = decodeBase64Url(q.get('t')) || q.get('text') || '';
  const threadsUrl = 'https://www.threads.com/intent/post?text=' + encodeURIComponent(text);
  const errorBox = document.getElementById('error');
  const threadsButton = document.getElementById('threads');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  try {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      if (typeof tg.expand === 'function') tg.expand();
    }
  } catch (_) {}

  if (!text) {
    threadsButton.disabled = true;
    threadsButton.classList.add('soon');
    showError('Не вдалося отримати текст результату. Поверніться в бот і відкрийте поширення ще раз.');
    return;
  }

  threadsButton.addEventListener('click', () => {
    errorBox.style.display = 'none';

    try {
      const tg = window.Telegram && window.Telegram.WebApp;

      if (tg && typeof tg.openLink === 'function') {
        tg.openLink(threadsUrl, { try_instant_view: false });
        return;
      }
    } catch (_) {}

    try {
      window.open(threadsUrl, '_blank', 'noopener,noreferrer');
    } catch (_) {
      location.href = threadsUrl;
    }
  });
})();
</script>
</body>
</html>
